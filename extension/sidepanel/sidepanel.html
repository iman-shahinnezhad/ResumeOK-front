<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ApplyDesk Copilot</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div class="panel-container">
    <!-- Header -->
    <header class="panel-header">
      <div class="brand">
        <div class="brand-logo-box">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#000000" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 18V10C4 6.68629 6.68629 4 10 4H14C17.3137 4 20 6.68629 20 10V18"></path>
          </svg>
        </div>
        <div>
          <div class="brand-title">Applydesk.io</div>
          <div class="brand-sub">Auto-Apply with confidence.</div>
        </div>
      </div>
      <div class="header-controls">
        <div class="token-pill">
          <span id="token-count">0</span>
          <span style="color:#f97316;">✦</span>
        </div>
        <button id="collapse-btn" class="collapse-btn-circle" title="Collapse Panel">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>
      </div>
    </header>

    <!-- Dynamic Content Area -->
    <main id="sidepanel-main-content">
      <!-- Card 1: Add to match score and autofill forms -->
      <div class="card-white">
        <div class="card-title-lg">Add to match score and autofill forms</div>
        <button id="add-job-action" class="btn-black-pill">
          +Add this job to Applydesk
        </button>
        <div id="add-job-msg" style="font-size:12px;color:#64748b;text-align:center;margin-top:8px;"></div>
      </div>

      <!-- Card 2: Resume Score -->
      <div class="card-white" style="margin-top: 12px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
          <div style="font-size:16px;font-weight:800;color:#0f172a;">Resume Score</div>
          <div id="resume-score-val" style="font-size:16px;font-weight:700;color:#94a3b8;">0/100</div>
        </div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;">
          <span style="font-size:20px;">📁</span>
          <span id="resume-filename-val" style="font-size:13px;font-weight:600;color:#334155;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">OmidMoradi_25jun.PDF</span>
        </div>
        <button id="fix-resume-btn" class="btn-outline-pill">
          <span style="color:#eab308;">⚡</span> Fix resume issues
        </button>
      </div>

      <!-- Card 3: Edit Your information -->
      <a href="https://applydesk.io/#/profile" target="_blank" class="edit-info-row" style="margin-top: 12px; text-decoration: none;">
        <div class="edit-info-text">Edit Your information</div>
        <div style="font-size:15px;font-weight:700;color:#64748b;">❯</div>
      </a>
    </main>
  </div>

  <script src="sidepanel.js"></script>
</body>
</html>
